# Every pull request must pass these before it can be merged (and so before it reaches the live site).
# Test data only: a throwaway Postgres inside the run, *.dev.grandview.local logins, no real secrets.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Type check, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  changelog:
    name: Change log updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md has a line for this change
        env:
          BASE: ${{ github.base_ref }}
          SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: |
          if [ "$SKIP" = "true" ]; then echo "Labelled no-changelog."; exit 0; fi
          if git diff --name-only "origin/$BASE...HEAD" | grep -qx 'CHANGELOG.md'; then exit 0; fi
          echo "::error file=CHANGELOG.md::Add a plain-English line under Unreleased (or label the pull request no-changelog for changes nobody using the app would notice)."
          exit 1

  e2e:
    name: Browser tests
    # Pull requests only: the run is long, and it gates merging.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grandview_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/grandview_ci
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      YCBM_WEBHOOK_SECRET: ci-only-ycbm-secret-0123456789abcdef0123
      FORM_WEBHOOK_SECRET: ci-only-form-secret-0123456789abcdef0123
      MFA_ENFORCED: "false"
      EMAIL_FROM: "Grandview Painting [TEST DATA] <ci@example.com>"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database (migrations, starter settings, one test login per role)
        run: |
          pnpm db:migrate
          pnpm db:seed:dev
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
